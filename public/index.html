<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#080808" />
    <meta name="description" content="APEXTRACK — Your personal athletic coach" />

    <!-- iOS PWA tags — makes it feel native on iPhone -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="APEXTRACK" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- iOS splash screens -->
    <link rel="apple-touch-icon" sizes="192x192" href="%PUBLIC_URL%/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="%PUBLIC_URL%/icon-512.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Prevent iOS text size adjustment -->
    <style>
      * { -webkit-text-size-adjust: 100%; }
      body { 
        margin: 0; 
        background: #080808; 
        overscroll-behavior: none;
        -webkit-overflow-scrolling: touch;
      }
      /* Safe area insets for iPhone notch / Dynamic Island */
      #root {
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
      }
    </style>

    <title>APEXTRACK</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
